<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="icon" href="./vector/favicon.svg">
    <title>Cosmic Arena - Beta Release</title>
    <link rel="stylesheet" href="./css/styles.css">
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="damage-vignette"></div>

    <div id="ui">
        <div class="stat-row">Cash: $<span id="cash">0</span></div>
        <div class="stat-row">
            HP: <div id="health-bar-container"><div id="health-bar-fill"></div></div>
        </div>
    </div>
    <div id="notifications"></div>
    
    <div id="shop">
        <h3>UPGRADES</h3>
        <button class="upgrade-btn" id="btn-speed" onclick="buyUpgrade('speed')">Tank Speed ($<span id="cost-speed">50</span>)</button>
        <button class="upgrade-btn" id="btn-rate" onclick="buyUpgrade('rate')">Fire Rate & Velocity ($<span id="cost-rate">50</span>)</button>
        <button class="upgrade-btn" id="btn-multishot" onclick="buyUpgrade('multishot')">Multi-Barrel ($<span id="cost-multishot">400</span>)</button>
        <button class="upgrade-btn" id="btn-maxhp" onclick="buyUpgrade('maxHp')">Max HP Boost ($<span id="cost-maxHp">100</span>)</button>
        <div class="sfx-row" onclick="toggleSfx()">
            <span>Sound effects</span>
            <span id="sfx-toggle-icon" class="sfx-toggle-icon">🔊</span>
        </div>
    </div>

    <div id="instructions">Click Arena to Aim with <b>Mouse</b> (or <b>Touch-Drag</b>) | <b>W/S</b> Forward/Back | <b>A/D</b> Strafe | <b>Pinch/Scroll</b> Zoom</div>

	<div class="bug-report">
	  <a href="cosmicarenadev@gmail.com?subject=Bug%20Report%20-%20Cosmic%20Arena&body=Hello,%20I%20found%20the%20following%20issue%20in%20the%20game:%0A%0A-%20Bug%20Description:" target="_blank" rel="noopener noreferrer">Report a bug</a>
	</div>

    <div id="gameover">
        <h1>GAME OVER</h1>
        <p>Your tank was destroyed in combat.</p>
        <p>Targets Destroyed: <span id="stat-targets">0</span></p>
        <p>Enemy Tanks Defeated: <span id="stat-bots">0</span></p>
        <button id="restart-btn" onclick="restartGame()">PLAY AGAIN</button>
    </div>

    <script src="./js/en.js"></script>
</body>
</html>
